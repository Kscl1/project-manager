# Product CI: the package tests, the repo's own tests, a secret scan and the Python lint.
name: pm-check

on:
  push:
  pull_request:

jobs:
  pm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dev tools (pinned in tools/dev-tools.txt)
        run: |
          python -m pip install -r tools/dev-tools.txt
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: Secret scan, whole history (blocks)
        run: gitleaks git --redact --no-banner .
      - name: Python lint and format (blocks)
        run: ruff check . && ruff format --check .
      - name: No private decision or task IDs (blocks)
        run: python tools/check_ids.py
      - name: Package tests
        run: python -m unittest discover -s template/.pm/tests
      - name: Swarm layer tests (worker runner, fake Herdr)
        run: python -m unittest discover -s template/.pm/swarm
      - name: Repo tests (setup screen, commit hooks)
        run: python -m unittest discover -s tests
