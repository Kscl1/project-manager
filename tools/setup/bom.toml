# Bill of materials: what the product needs, read by the setup TUI (DESIGN.md).
#
# id      stable key, never renamed.
# kind    command: the TUI runs `check` (a command and its arguments, never a shell line) and reads the version.
#         project-file: lives in the user's project at `path`, checked when setup is given the project folder;
#         `has` is text the file must hold (a file of the user's own without it is "merge by hand").
#         manual: nothing on the machine to check.
# min     below it the TUI warns. tested: above it the TUI says "not tested yet". Until an older version has been
#         tried, min equals tested. Leave both out when unknown. Command items need both.
# install.* and upgrade.* run through the platform shell only after the user presses Enter on that step (DESIGN.md);
# note is text shown to the user. upgrade.<os> is used for an item below its minimum when install does not upgrade.
# similar: names of skills, MCP servers or plugins the user may already have that do the same job (shown, never removed).

# Core: required for the first trial.

[[item]]
id = "python"
name = "Python"
kind = "command"
layer = "core"
check = ["python", "--version"]  # "python" means the interpreter running the TUI
min = "3.11"
tested = "3.11.9"
install.windows = "winget install --id Python.Python.3.11 --exact --source winget"
install.linux = "sudo pacman -S --needed python"
note = "Preinstalled on Omarchy, where it is 3.14 and not tested yet."

[[item]]
id = "git"
name = "Git"
kind = "command"
layer = "core"
check = ["git", "--version"]
min = "2.54.0"
tested = "2.54.0"
install.windows = "winget install --id Git.Git --exact --source winget"
upgrade.windows = "winget upgrade --id Git.Git --exact --source winget"
install.linux = "sudo pacman -S --needed git"
note = "Preinstalled on Omarchy."

[[item]]
id = "node"
name = "Node.js"
kind = "command"
layer = "core"
check = ["node", "--version"]
min = "24.14.0"
tested = "24.14.0"
install.windows = "winget install --id OpenJS.NodeJS.LTS --exact --source winget"
upgrade.windows = "winget upgrade --id OpenJS.NodeJS.LTS --exact --source winget"
install.linux = "omarchy install dev-env node"

[[item]]
id = "claude-code"
name = "Claude Code"
kind = "command"
layer = "core"
check = ["claude", "--version"]
min = "2.1.296"
tested = "2.1.296"
install.windows = "irm https://claude.ai/install.ps1 | iex"
install.linux = "curl -fsSL https://claude.ai/install.sh | bash"
note = "Updates itself, so it often shows as not tested yet. On Linux the installer puts claude in ~/.local/bin; if it is not found afterwards, add that folder to PATH as the installer says."

[[item]]
id = "backlog"
name = "Backlog.md"
kind = "command"
layer = "core"
check = ["backlog", "--version"]
min = "1.52.0"
tested = "1.52.0"
install.windows = "npm i -g backlog.md@1.52.0"
install.linux = "npm i -g backlog.md@1.52.0"
note = "Needs Node.js first. If npm says EACCES on Linux, follow https://docs.npmjs.com/resolving-eacces-permissions-errors-when-installing-packages-globally rather than sudo."

