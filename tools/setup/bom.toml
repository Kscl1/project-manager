# Swarm: optional, unticked until the user chooses it. Workers run in visible Herdr panes, driven by pm_run.

[[item]]
id = "pi"
name = "Pi"
kind = "command"
layer = "swarm"
check = ["pi", "--version"]
min = "1.0.3"
tested = "1.4.0"
install.windows = "npm i -g @earendil-works/pi-coding-agent@1.4.0"
install.linux = "npm i -g @earendil-works/pi-coding-agent@1.4.0"
note = "Needs Node.js first. Pi workers reach a model through the account you sign in with in Pi (/login); a ChatGPT plan works through OpenAI, Sign in with ChatGPT."

[[item]]
id = "herdr"
name = "Herdr"
kind = "command"
layer = "swarm"
check = ["herdr", "--version"]
min = "0.9.3"
tested = "0.9.5"
# renovate-herdr: discovery only; the installer still installs upstream latest, not this candidate.
upstream_version = "0.9.5"
install.windows = "irm https://herdr.dev/install.ps1 | iex"
install.linux = "curl -fsSL https://herdr.dev/install.sh | sh"
note = "Herdr's own installer puts the newest release on PATH and checks its SHA-256, so it often shows as not tested yet. On Linux it installs to ~/.local/bin; if herdr is not found afterwards, add that folder to PATH as the installer says. With mise, mise use -g herdr works too."

[[item]]
id = "pi-mcp-adapter"
name = "Pi extension pi-mcp-adapter"
kind = "command"
layer = "swarm"
check = ["pi", "list", "--no-approve"]  # the user's own Pi packages; --no-approve skips any project's, and its trust question
package = "npm:pi-mcp-adapter"
min = "2.36.0"
tested = "5.4.0"
install.windows = "pi install npm:pi-mcp-adapter@5.4.0"
install.linux = "pi install npm:pi-mcp-adapter@5.4.0"
note = "Gives Pi workers the project's MCP servers from .mcp.json, such as Context7. Setup checks your user-level Pi packages, not a project's own .pi/settings.json."

