# Bill of materials: what the product needs, read by the setup TUI (DESIGN.md).
#
# id      stable key, never renamed.
# kind    command: the TUI runs `check` (a command and its arguments, never a shell line) and reads the version.
#         project-file: lives in the user's project at `path`, checked when setup is given the project folder;
#         `has` is text the file must hold (a file of the user's own without it is "merge by hand").
#         manual: nothing on the machine to check.
# min     below it the TUI warns. tested: above it the TUI says "not tested yet". Until an older version has been
#         tried, min equals tested. Leave both out when unknown. Command items need both.
# install.* and upgrade.* run through the platform shell only after the user presses Enter on that step (DESIGN.md);
# note is text shown to the user. upgrade.<os> is used for an item below its minimum when install does not upgrade.
# similar: names of skills, MCP servers or plugins the user may already have that do the same job (shown, never removed).
# package: for a check that lists packages (`pi list`), the name it lists; the version comes from that package's folder.
# folder: for an item that lives in a folder of its own outside the project (~ is the home folder), where `check`
#         runs; no folder means missing.
# Versions have different meanings: min is the support floor; tested is human-run compatibility evidence;
# install.* contains actual command pins. Renovate changes only command pins and the upstream_* candidate fields
# below, never min/tested/ref. upstream_version fields discover upstream releases, not certification or
# installed provenance; setup does not consume them. Review and test before promoting any candidate.

# Core: required.

[[item]]
id = "python"
name = "Python"
kind = "command"
layer = "core"
check = ["python", "--version"]  # "python" means the interpreter running the TUI
min = "3.11"
tested = "3.14.7"
install.windows = "winget install --id Python.PythonInstallManager --exact --source winget"
install.linux = "sudo pacman -S --needed python"
note = "The TUI cannot install the Python it runs on. On Windows, after the Install Manager, open a new terminal and run py install 3.13; the older Python.Python.3.x installers can be stopped by Smart App Control (Bad Image). Preinstalled on Omarchy (3.14); Linux is not tested yet."

[[item]]
id = "git"
name = "Git"
kind = "command"
layer = "core"
check = ["git", "--version"]
min = "2.54.0"
tested = "2.55.0"
install.windows = "winget install --id Git.Git --exact --source winget"
upgrade.windows = "winget upgrade --id Git.Git --exact --source winget"
install.linux = "sudo pacman -S --needed git"
note = "Preinstalled on Omarchy."

[[item]]
id = "node"
name = "Node.js"
kind = "command"
layer = "core"
check = ["node", "--version"]
min = "24.14.0"
tested = "24.14.0"
install.windows = "winget install --id OpenJS.NodeJS.LTS --exact --source winget"
upgrade.windows = "winget upgrade --id OpenJS.NodeJS.LTS --exact --source winget"
install.linux = "omarchy install dev-env node"

[[item]]
id = "claude-code"
name = "Claude Code"
kind = "command"
layer = "core"
check = ["claude", "--version"]
min = "2.1.296"
tested = "2.1.302"
# Windows: the installer puts claude in ~\.local\bin but leaves that folder off PATH, so the line adds it to the user PATH.
install.windows = 'irm https://claude.ai/install.ps1 | iex; $bin = "$HOME\.local\bin"; $user = [Environment]::GetEnvironmentVariable("Path", "User"); if (($user -split ";") -notcontains $bin) { [Environment]::SetEnvironmentVariable("Path", "$user;$bin".TrimStart(";"), "User") }'
install.linux = "curl -fsSL https://claude.ai/install.sh | bash"
note = "Updates itself, so it often shows as not tested yet. On Windows this step also adds %USERPROFILE%\\.local\\bin to your user PATH, which the installer asks you to do by hand; open a new terminal before you run claude yourself. On Linux the installer puts claude in ~/.local/bin; if it is not found afterwards, add that folder to PATH as the installer says."

