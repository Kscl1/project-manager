# Python lint and format rules for this repo's tools (D-86). Run by .githooks/pre-commit and CI.
line-length = 120
target-version = "py38"  # the package tools support Python 3.8+
include = ["*.py"]  # ruff 0.16 would also reformat code blocks in our Markdown docs
extend-exclude = ["docs/research"]  # dated records are never rewritten

[lint]
# Explicit list: ruff's defaults change between versions. E4/E7/E9/F are the classic error rules,
# I sorts imports, BLE001/S110 catch errors swallowed by broad excepts, T100 catches leftover debuggers.
select = ["E4", "E7", "E9", "F", "I", "BLE001", "S110", "T100"]
